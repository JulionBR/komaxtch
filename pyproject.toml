[project]
name = "komaxtch"
version = "0.1.0"
description = "Converte mangá e HQ (EPUB/CBZ) em XTCH quadro a quadro para o Xteink X3/X4 com CrossPoint"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pillow>=11.0",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "ultralytics>=8.3",
    "huggingface-hub>=0.26",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
]

[project.scripts]
komaxtch = "komaxtch.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/komaxtch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
